<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>페이지를 찾을 수 없습니다 (404) — EngMon</title>
<meta name="description" content="요청한 주소의 페이지를 찾을 수 없습니다. EngMon 매거진으로 돌아가 주세요." />
<!-- 404 는 색인 대상이 아니지만, 링크는 따라가도 되므로 follow 를 남깁니다. -->
<meta name="robots" content="noindex, follow" />
<meta name="theme-color" content="#0a0e13" />
<link rel="icon" href="/icon.svg" type="image/svg+xml" />
<link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<link rel="preload" as="font" type="font/woff2" href="/assets/fonts/pretendard-variable.woff2" crossorigin />
<script>
  /* 매거진에서 고른 테마를 그대로 적용합니다. 고른 적이 없으면 OS 설정을 따릅니다. */
  (function () {
    var t;
    try { t = localStorage.getItem('monsterlab.theme'); } catch (e) { t = null; }
    if (t !== 'dark' && t !== 'light' && t !== 'system') t = 'system';
    var light = t === 'light' ||
      (t === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches);
    var theme = light ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', theme);
    var m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute('content', light ? '#fbfcfd' : '#0a0e13');
  })();
</script>
<link rel="stylesheet" href="/assets/site.css" />
<!-- 방문 분석 (자체 호스팅) — index.html 과 같은 태그입니다. 쿠키를 쓰지 않습니다. -->
<script defer src="https://visitor-analytics-a5bp.onrender.com/analytics.js" data-domain="engmon.monster"></script>
</head>
<body>
<main class="wrap notfound">
  <div class="code" aria-hidden="true">404</div>
  <h1>이 주소에는 페이지가 없습니다</h1>
  <p>주소가 바뀌었거나 오타일 수 있습니다. EngMon 매거진의 첫 화면에서 주(week)를 골라 다시 시작해 보세요.</p>
  <a class="btn" href="/">EngMon 홈으로</a>
</main>
</body>
</html>
